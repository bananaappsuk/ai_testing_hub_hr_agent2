<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Policy Agent</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --ink: #1c1c1e; --muted: #6b6b70;
    --line: #e3e3e6; --accent: #2f6f4f; --accent-ink: #ffffff; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2023; --ink: #ececee; --muted: #9a9aa0;
      --line: #303136; --accent: #4e9b73; --accent-ink: #10110f; --err: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .meta code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #new {
    margin-left: auto; font: inherit; font-size: 13px; cursor: pointer;
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; padding: 5px 11px;
  }
  #new:hover { color: var(--ink); border-color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 14px; max-width: 86%;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .user .bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .err .bubble { background: var(--panel); border: 1px solid var(--err); color: var(--err); }
  .hint { color: var(--muted); font-size: 13.5px; text-align: center; padding: 28px 0; }
  .dots span {
    display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%;
    background: var(--muted); animation: b 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%,60%,100% { opacity: .25 } 30% { opacity: 1 } }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  form { max-width: 720px; margin: 0 auto; display: flex; gap: 9px; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; max-height: 160px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button[type=submit] {
    font: inherit; font-weight: 550; cursor: pointer; border: none; border-radius: 9px;
    padding: 0 18px; background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>HR Policy Agent</h1>
  <span class="meta"><code>{{ model }}</code> · prompt <code>{{ variant }}</code></span>
  <button id="new">New conversation</button>
</header>

<main><div class="wrap" id="log">
  <p class="hint">Ask about leave entitlement, right-to-work checks, conduct, or any HR policy.<br>Answers are grounded in the company HR Policy document.</p>
</div></main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask a question…" autofocus></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</footer>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');

let sessionId = localStorage.getItem('hr_session') || crypto.randomUUID();
localStorage.setItem('hr_session', sessionId);

function add(role, text) {
  const hint = log.querySelector('.hint');
  if (hint) hint.remove();
  const row = document.createElement('div');
  row.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  log.appendChild(row);
  row.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return bubble;
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

form.addEventListener('submit', async e => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  add('user', message);
  input.value = '';
  input.style.height = 'auto';
  send.disabled = true;

  const pending = add('bot', '');
  pending.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, session_id: sessionId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    pending.textContent = data.reply;
  } catch (err) {
    pending.parentElement.className = 'msg err';
    pending.textContent = String(err.message || err);
  } finally {
    send.disabled = false;
    input.focus();
  }
});

document.getElementById('new').addEventListener('click', async () => {
  await fetch('/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId }),
  });
  sessionId = crypto.randomUUID();
  localStorage.setItem('hr_session', sessionId);
  log.innerHTML = '<p class="hint">New conversation started.</p>';
  input.focus();
});
</script>
</body>
</html>
